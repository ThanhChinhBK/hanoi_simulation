[package]
name = "hanoi-engine-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Hanoi traffic engine (runs in a Web Worker)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hanoi-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
